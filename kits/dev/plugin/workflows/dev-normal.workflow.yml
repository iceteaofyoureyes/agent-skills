{
  "schema_version": "1.0",
  "workflow": {
    "id": "dev-vnext-normal",
    "name": "Dev VNext Runtime",
    "version": "2.0.0",
    "author": "Agent Skills Dev Kit",
    "description": "Workflow transport for exact Engineering Handoff authority; terminal Dev state READY_FOR_TEST."
  },
  "requires": {
    "speckit_version": "==1.0.11"
  },
  "inputs": {
    "devkit_command": {
      "type": "string",
      "default": "devkit"
    },
    "integration": {
      "type": "string",
      "default": "auto"
    },
    "run_dir": {
      "type": "string",
      "default": ""
    },
    "run_id": {
      "type": "string",
      "default": ""
    },
    "host": {
      "type": "string",
      "default": ""
    },
    "technical_choice": {
      "type": "string",
      "default": ""
    },
    "technical_receipt_ref": {
      "type": "string",
      "default": ""
    }
  },
  "steps": [
    {
      "id": "validate-authority",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" validate-authority"
    },
    {
      "id": "engineering-impact",
      "type": "prompt",
      "integration": "{{ inputs.integration }}",
      "prompt": "Inspect source and the exact Engineering Handoff VNext. Create Engineering Impact V2 at impact.json inside the active run. Record technical facts, knowledge impact, unknowns, repository base revisions and explicit write paths. Do not fabricate answers or decide WHAT. A WHAT gap must use raise-gap and route BA/Human. Preserve APPROVAL STATE != INLINE LIFECYCLE TEXT: APPROVED_FOR_ENGINEERING or PENDING_HUMAN_REVIEW prose is not authority; revalidate exact canonical proof. open_items.blocking is a blocker; open_items.non_blocking does not alone establish a semantic contradiction. V1 SUPERSEDED_BY_DELIVERY_MANIFEST is read-only LEGACY_COMPAT and supplies no VNext authority."
    },
    {
      "id": "bind-impact",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" impact --artifact \"{{ inputs.run_dir }}/impact.json\""
    },
    {
      "id": "technical-plan",
      "type": "prompt",
      "integration": "{{ inputs.integration }}",
      "prompt": "Write dev-plan.md and dev-tasks.md in the active run, referencing upstream authority and engineering impact. Use incremental slices, focused tests and regression-first TDD. Record active material ED exact refs. Write engineering-decision-refs.json as an array of exact ED refs (empty when no material ED). Do not duplicate BR/FR business prose or expand repository/write scope."
    },
    {
      "id": "bind-plan",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" plan --plan \"{{ inputs.run_dir }}/dev-plan.md\" --tasks \"{{ inputs.run_dir }}/dev-tasks.md\" --decision-refs \"{{ inputs.run_dir }}/engineering-decision-refs.json\""
    },
    {
      "id": "technical-gate-requirement",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" technical-gate-required",
      "output_format": "json"
    },
    {
      "id": "conditional-technical-gate",
      "type": "if",
      "condition": "{{ steps.technical-gate-requirement.output.data.required }}",
      "then": [
        {
          "id": "human-tech-lead-plan-gate",
          "type": "gate",
          "message": "Review the exact impact, ED set, plan/tasks, repository bases, write scope and risk. This choice is only workflow transport. Supply an exact authenticated Human/Tech Lead receipt through the trusted host before implementation.",
          "options": [
            "approve",
            "reject"
          ],
          "on_reject": "abort",
          "verdict_input": "technical_choice"
        },
        {
          "id": "bind-authenticated-technical-receipt",
          "type": "shell",
          "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" bind-technical-approval --artifact \"{{ inputs.technical_receipt_ref }}\""
        }
      ],
      "else": []
    },
    {
      "id": "implementation-ready",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" implementation-ready"
    },
    {
      "id": "begin-implementation",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" begin-implementation"
    },
    {
      "id": "implementation",
      "type": "prompt",
      "integration": "{{ inputs.integration }}",
      "prompt": "Implement only the bound technical plan, with focused tests for incremental slices. Every runtime-controlled write must use write-source or authorize-write for its exact repository/path. Stop and raise-gap for WHAT ambiguity; use escalate-risk/replan for new material risk. Stop before the single consolidated review."
    },
    {
      "id": "consolidated-review",
      "type": "prompt",
      "integration": "{{ inputs.integration }}",
      "prompt": "Perform exactly one consolidated full review against exact upstream authority, snapshot and implementation revisions. Write review-evidence.json and review-ref.json inside the run. Record blocking findings in blocking-findings.json. WHAT/spec findings require an Engineering Gap artifact, never a code-first workaround. For blockers use one begin-fix-wave followed by at most one scoped rereview; never another full review."
    },
    {
      "id": "record-consolidated-review",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" review --evidence-ref \"{{ inputs.run_dir }}/review-ref.json\" --findings \"{{ inputs.run_dir }}/blocking-findings.json\""
    },
    {
      "id": "bounded-blocking-resolution",
      "type": "prompt",
      "integration": "{{ inputs.integration }}",
      "prompt": "If blocking findings exist, claim begin-fix-wave once, fix only those findings through the mutation guard, and submit one scoped review with exact evidence and remaining blockers. If no blockers, do no work. No second full review or unapproved scope expansion."
    },
    {
      "id": "fresh-engineering-verification",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" verify"
    },
    {
      "id": "coverage",
      "type": "prompt",
      "integration": "{{ inputs.integration }}",
      "prompt": "Write coverage.json mapping every exact approved BR/FR ID to code and test evidence. Do not invent requirement IDs, claim downstream acceptance or modify the final handoff directly."
    },
    {
      "id": "canonical-dev-handoff",
      "type": "shell",
      "run": "\"{{ inputs.devkit_command }}\" --host \"{{ inputs.host }}\" --run-id \"{{ inputs.run_id }}\" finalize --coverage \"{{ inputs.run_dir }}/coverage.json\""
    }
  ]
}
