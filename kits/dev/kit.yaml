{
  "schema_version": 2,
  "id": "dev",
  "name": "Dev Kit",
  "version": "0.1.0-dev.3",
  "status": "READY_FOR_SOL_REVIEW",
  "packaging": {
    "type": "agent-plugin",
    "path": "kits/dev/plugin"
  },
  "authority": {
    "business_what": "Approved BA Baseline",
    "engineering_impact": "Dev Kit",
    "implementation_how": "Dev Kit planning",
    "final_acceptance": "Test Kit / Human"
  },
  "shared_skills": {
    "required": [
      "requirements-gap-auditor",
      "verification-before-completion"
    ]
  },
  "plugin_skills": {
    "core": [
      "planning-and-task-breakdown",
      "incremental-implementation",
      "test-driven-development",
      "code-review-and-quality"
    ],
    "conditional": [
      "debugging-and-error-recovery",
      "security-and-hardening",
      "api-and-interface-design",
      "source-driven-development",
      "performance-optimization",
      "observability-and-instrumentation"
    ]
  },
  "utilities": [
    "scripts/review-package"
  ],
  "runtime_dependencies": {
    "spec_kit": {
      "version": "v1.0.11",
      "role": "workflow_state_and_bundle_engine",
      "required_for": [
        "normal",
        "high-risk"
      ],
      "excluded_commands": [
        "speckit.specify",
        "speckit.plan",
        "speckit.tasks",
        "speckit.analyze",
        "speckit.converge"
      ],
      "reason": "Those commands require Spec Kit spec.md semantics and would create a second WHAT representation beside the Approved BA Baseline."
    },
    "codebase_memory_mcp": {
      "version": "v0.11.0",
      "required": false,
      "trigger": "uncertain blast radius"
    }
  },
  "review_budget": {
    "max_full_reviews": 1,
    "max_blocking_fix_waves": 1,
    "max_scoped_rereviews": 1
  },
  "runtime": {
    "marketplace_manifest": ".agents/plugins/marketplace.json",
    "external_project_installer": "tooling/install_dev_kit.py",
    "external_project_runtime_root": "~/.devkit/runtime/v1",
    "external_project_cli": "~/.devkit/bin/devkit",
    "workflow_definitions": [
      "plugin/workflows/dev-normal.workflow.yml",
      "plugin/workflows/dev-high-risk.workflow.yml"
    ],
    "run_state": ".specify/workflows/runs/<spec-kit-run-id>/state.json",
    "artifacts": ".devkit/runs/<change_id>/"
  },
  "outputs": [
    "impact-manifest.json",
    "dev-plan.md",
    "dev-tasks.md",
    "review.json",
    "dev-handoff.json"
  ],
  "release_claim": "No READY/RC claim until provenance, Doctor, benchmark, fresh-session acceptance and docs gates pass."
}
