{
  "schema_version": 1,
  "id": "ba",
  "name": "BA Kit",
  "version": "2.0.0-rc.4",
  "workflow": {"skill": "ba-workflow"},
  "core": ["verification-before-completion", "codebase-discovery"],
  "skills": {
    "required": [
      "requirements-gap-auditor",
      "requirements-interrogator",
      "requirements-quality-check",
      "business-rule-extractor",
      "srs-function-document",
      "document-docx",
      "drawio-skill"
    ],
    "optional": [
      "product-design-and-ux",
      "frontend-design",
      "impeccable",
      "playwright",
      "web-accessibility"
    ]
  },
  "capabilities": {
    "baseline_lifecycle": "DRAFT -> VALIDATED -> HUMAN_REVIEW -> APPROVED_BASELINE",
    "canonical_authority": ["BA Decisions", "Business Rules (BR-*)", "canonical SRS (FR-*)", "BA Baseline Candidate/Manifest"],
    "runtime": ["workflow-state V2"],
    "evidence_and_gate": ["host-authenticated BA Human approval receipt", "exact evidence refs"],
    "handoff": ["Engineering Handoff VNext"],
    "derived": ["DOCX", "Draw.io", "optional prototype/visual outputs"],
    "legacy": "V1 workflow state and handoff are LEGACY_COMPAT; they never establish VNext approval"
  },
  "outputs": [
    "workflow-state-vnext.json (RUNTIME; not business authority)",
    "BA Decisions V1",
    "Business Rules (BR-*)",
    "canonical SRS (FR-*)",
    "BA Baseline Candidate/Manifest V1",
    "host-supplied BA Human approval receipt V1 (evidence input)",
    "Engineering Handoff VNext",
    "derived DOCX / Draw.io / optional visual outputs",
    "V1 workflow-state.json and engineering-handoff.yml (LEGACY_COMPAT only)"
  ]
}
