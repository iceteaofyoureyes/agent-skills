schema_version: 1
kit: test
contract: Test Kit Manual VNext + Test Automation V1 + Test Execution VNext / Phase 8
completion_guard:
  tier_3_fresh_installed_runtime_required: true
  tier_1_or_tier_2_can_mark_phase_6_complete: false
  tier_4_fresh_installed_automation_v1_required: true
  tier_1_to_tier_3_can_mark_phase_7_complete: false
  tier_5_fresh_installed_execution_vnext_required: true
  tier_1_to_tier_4_can_mark_phase_8_complete: false
tiers:
  tier_1_deterministic:
    run_for_each_test_change: true
    commands:
      - python -m unittest tooling.tests.test_test_kit_vnext -v
      - python -m unittest tooling.tests.test_test_kit_vnext_schemas -v
      - python -m unittest tooling.tests.test_test_kit_v1 -v
      - python -m unittest tooling.tests.test_test_kit_v1_case_gate -v
      - python -m unittest tooling.tests.test_test_kit_v1_cases -v
      - python -m unittest tooling.tests.test_test_kit_policy -v
      - python -m unittest tooling.tests.test_test_kit_policy_doctor -v
      - python -m unittest tooling.tests.test_test_kit_customization -v
      - python -m unittest tooling.tests.test_test_kit_customization_excel -v
      - python -m unittest tooling.tests.test_test_kit_v1_xmind -v
      - python -m unittest tooling.tests.test_test_kit_v1_excel -v
      - python -m unittest tooling.tests.test_kit_packaging -v
      - python -m unittest tooling.tests.test_ba_vnext -v
      - python -m unittest tooling.tests.test_dev_vnext -v
      - python -m unittest tooling.tests.test_ba_vnext_installed_acceptance -v
      - python -m unittest tooling.tests.test_dev_vnext_installed_acceptance -v
      - python -m unittest tooling.tests.test_project_foundation -v
      - python -m unittest tooling.tests.test_sdlc_acceptance -v
      - python -m unittest discover -s tooling/tests -p "test_*.py"
      - python -m unittest tooling.tests.test_test_kit_vnext_installed_acceptance -v
      - python -m unittest tooling.tests.test_test_automation_v1 -v
      - python -m unittest tooling.tests.test_test_automation_v1_schemas -v
      - python -m unittest tooling.tests.test_test_automation_v1_acceptance -v
      - python -m unittest tooling.tests.test_test_automation_v1_installed_acceptance -v
      - python -m unittest tooling.tests.test_test_execution_vnext -v
      - python -m unittest tooling.tests.test_test_execution_vnext_acceptance -v
      - python -m unittest tooling.tests.test_test_execution_vnext_installed_acceptance -v
      - git diff --check
  tier_2_focused_runtime:
    cases:
      - Exact BA Engineering Handoff VNext Human authority and source byte revalidation
      - Canonical BR/FR-only trace; BAREF is rejected as a canonical reference
      - Design and Case gates bind exact snapshots and all consumed authority refs
      - Validation PASS and agent callbacks cannot self-approve either gate
      - UNKNOWN/deferred requirements stay unresolved; material required execution dependencies block Case approval
      - UX is required only by explicit ux_required; field/input/page prose cannot infer UX authority
      - Exact approved UX contract, receipt, revision, source hashes, snapshot hash and trusted Human authentication are revalidated
      - Stale UX, prototype-only UX and unauthenticated UX approval fail closed
      - Optional Dev context remains technical and cannot redefine BA WHAT
      - Request-changes requires a new revision; persistence and resume revalidate exact refs
      - XMind derives only from APPROVED_DESIGN; Excel derives only from APPROVED_TESTWARE
      - Approved Testware VNext HANDOFF_MANIFEST binds exact refs and APPROVED_TESTWARE is terminal for Phase 6
      - Delivery Manifest is not required or authoritative; V1 is LEGACY_COMPAT with vnext_authority=false
      - Doctor READY means package/capability readiness only; optional projections may be DEGRADED
      - Automation Suitability accounts for every exact Approved Testcase once and rejects BAREF
      - AUT identity, BR/FR to TD to TC trace, argv commands and Plan revisions remain exact
      - Test Automation repository resolves only through project policy plus topology
      - Application repositories reject Test Automation writes; UNIT/COMPONENT bind Dev-local evidence
      - MANUAL_ONLY remains valid; required BLOCKED and required OPEN dependencies prevent EXECUTION_READY
      - Replan creates a new Plan revision and clears stale implementation/review/verification evidence
      - Automation Verification never executes the stored product command or real SUT
      - EXECUTION_READY binds exact Dev READY_FOR_TEST, app revisions and automation revision
      - Execution Manifest binds current Phase 7 authority, environment and multi-repository revisions
      - Commands use only exact Automation Plan argv with shell disabled and clean exact repositories
      - Command failure does not create a Finding or Defect without Tester Observation and classification
      - Manual Observation uses the approved Testcase oracle; Dev-local evidence remains accounted
      - Only an authenticated Tester can classify Findings or create final VERIFIED
      - Four non-Defect classifications route without a Defect Handoff or current-attempt VERIFIED
      - Dev fixes use normal FEATURE_DELIVERY with original BA authority and failed repository bases
      - READY_FOR_RETEST binds fixed app revisions and the original failed testcase oracle
      - Failed retest creates REOPENED with stable defect ID; Dev cannot self-close
      - Post-VERIFIED repository or environment drift invalidates revalidation
    isolated_ephemeral_session_per_probe: true
    bounded_timeout_seconds: 120
    optional_review_service_required: false
  tier_3_fresh_installed_runtime:
    run_for_phase_6_completion: true
    requires_external_working_directory: true
    python_isolated_mode_required: true
    pythonpath_must_be_absent: true
    installed_runtime_imports_only: true
    flow: >-
      Install Test Kit into a clean project; run Doctor; validate isolated imports from the installed
      Test package; authenticate a synthetic TEST_ONLY BA Handoff host fixture; prepare and finalize
      a neutral Design; prove validation PASS does not approve; authenticate the exact Human Design
      receipt; prepare and finalize Cases; prove validation PASS does not approve; authenticate the
      exact Human Case receipt; reach APPROVED_TESTWARE; re-read and revalidate the HANDOFF_MANIFEST,
      BR/FR-only trace and exact hashes; prove no BAREF and no execution or VERIFIED claim; run Doctor
      again; inspect V1 as LEGACY_COMPAT; and exercise explicit UX-required and optional-context cases.
    required_for_phase_6_completion: true
  tier_4_fresh_installed_automation_v1:
    run_for_phase_7_completion: true
    requires_external_working_directory: true
    python_isolated_mode_required: true
    pythonpath_must_be_absent: true
    installed_runtime_imports_only: true
    no_internet_browser_external_database_or_real_sut: true
    flow: >-
      Install Test Kit into a clean synthetic multi-repository project; run Doctor; use python -I from
      an external directory with PYTHONPATH absent; import Automation V1 from the installed Test
      package; revalidate exact synthetic Approved Testware VNext; create Suitability and Plan;
      prove API automation and framework-agnostic E2E planning; prove UNIT/COMPONENT use exact
      Dev-local evidence and app repositories reject writes; account for MANUAL_ONLY; block required
      BLOCKED and OPEN dependencies; perform a scoped automation write, consolidated review and
      automation-only verification; bind the exact Dev READY_FOR_TEST handoff and app revisions;
      create and revalidate EXECUTION_READY; run Doctor again; confirm no execution claim.
    required_for_phase_7_completion: true
  tier_5_fresh_installed_execution_vnext:
    run_for_phase_8_completion: true
    requires_external_working_directory: true
    python_isolated_mode_required: true
    pythonpath_must_be_absent: true
    installed_runtime_imports_only: true
    no_network_browser_external_database_or_real_sut: true
    flow: >-
      Install Test Kit into a clean synthetic multi-repository project; run Doctor; use python -I
      from an external directory with PYTHONPATH absent; assert Phase 8 modules resolve under
      installed .test-kit; revalidate exact EXECUTION_READY; create the environment and immutable
      Execution Manifest; demonstrate automated/manual PASS observations and Tester VERIFIED;
      demonstrate a real synthetic command failure, Tester Finding and DEFECT classification; run a
      real Dev VNext FEATURE_DELIVERY fix using original BA authority and exact failed app base; validate
      Dev review and fresh verification; create READY_FOR_RETEST; demonstrate failed retest to REOPENED
      and a later same-ID fix/retest to VERIFIED; exercise role separation and revision-drift rejection;
      run Doctor again. Tier 2 acceptance covers each non-Defect route.
    required_for_phase_8_completion: true
automated:
  - command: python -m unittest tooling.tests.test_test_kit_vnext_installed_acceptance -v
    proves: >-
      Fresh Test Kit install, isolated installed runtime, full Design and Case Human Gates,
      explicit UX authority behavior, exact Approved Testware VNext manifest and V1 compatibility.
  - command: python -m unittest tooling.tests.test_test_automation_v1_installed_acceptance -v
    proves: >-
      Fresh isolated installed Test package Automation V1 intake, exact VNext authority revalidation,
      synthetic multi-repository API/E2E planning, read-only app boundary, review, automation-only
      verification, exact Dev READY_FOR_TEST binding and durable EXECUTION_READY revalidation.
  - command: python -m unittest tooling.tests.test_test_execution_vnext_installed_acceptance -v
    proves: >-
      Fresh isolated installed Test package execution, exact Phase 7 intake, environment and repository
      binding, straight-pass Tester VERIFIED, a real Dev VNext FEATURE_DELIVERY fix, READY_FOR_RETEST,
      REOPENED lineage, final Tester retest, role separation and revision drift rejection.
manual:
  - case: fresh project install without optional projection dependencies
    expected: core VNext remains usable; Doctor reports optional projection gaps as DEGRADED
  - case: neutral VNext example
    expected: a real BA Engineering Handoff and two authenticated Human Gate decisions are required
  - case: uninstall Test Kit after local project edits
    expected: only unchanged files owned by the Test package are removed; edits and unrelated files remain
  - case: test automation verification
    expected: verification checks only automation artifacts and does not execute a real SUT
